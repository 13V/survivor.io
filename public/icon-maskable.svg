<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Outbreak Survivors">
  <!-- Maskable variant: full-bleed background, motif scaled into the ~80% safe zone. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1b2130"/>
      <stop offset="100%" stop-color="#0e1016"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee08c"/>
      <stop offset="100%" stop-color="#34b866"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- 0.78 scale keeps the trefoil inside the maskable safe zone -->
  <g transform="translate(256 256) scale(0.78)" fill="url(#blade)">
    <g id="petal">
      <path d="M 0 -150
               C 46 -150 84 -118 92 -74
               C 64 -90 30 -96 0 -86
               C -30 -96 -64 -90 -92 -74
               C -84 -118 -46 -150 0 -150 Z"/>
      <path d="M 0 -78 C 26 -78 46 -58 46 -32 C 46 -16 38 -2 26 6 L 0 -10 L -26 6 C -38 -2 -46 -16 -46 -32 C -46 -58 -26 -78 0 -78 Z" fill="#0e1016"/>
    </g>
    <use href="#petal" transform="rotate(120)"/>
    <use href="#petal" transform="rotate(240)"/>

    <circle r="40" fill="#0e1016"/>
    <circle r="40" fill="none" stroke="#ffd24a" stroke-width="8"/>
    <circle r="14" fill="#ffd24a"/>
  </g>
</svg>
